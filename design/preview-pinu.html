<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pinu · orbe</title>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:opsz,wght@17..18,400..700&family=Outfit:wght@200..700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0A0A0A;--s2:#1A1A1A;--s3:#303030;--t1:#fff;--t2:#B3B3B3;--ac:#C3D14A}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t1);font-family:"Google Sans",system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center}
.top{margin-top:28px;display:flex;flex-direction:column;align-items:center;gap:6px}
.badge{background:var(--ac);color:#0A0A0A;font:600 13px "Google Sans",system-ui,sans-serif;padding:6px 14px;border-radius:999px}
.on{font-size:12px;color:var(--t2);display:flex;gap:6px;align-items:center}.on i{width:6px;height:6px;border-radius:50%;background:var(--ac)}
.stage{position:relative;width:min(78vw,340px);aspect-ratio:1;margin:40px 0 24px;display:grid;place-items:center}
.glow{position:absolute;inset:-18%;border-radius:50%;background:radial-gradient(circle,rgba(195,209,74,.28),rgba(42,92,11,.12) 45%,transparent 70%);filter:blur(10px);transition:opacity .6s}
.orb{position:relative;width:100%;height:100%;border-radius:46% 54% 52% 48%/50% 44% 56% 50%;
 background:
  radial-gradient(circle at 30% 28%,rgba(255,255,255,.55),rgba(255,255,255,0) 22%),
  radial-gradient(circle at 70% 70%,#C3D14A 0%,rgba(195,209,74,0) 45%),
  radial-gradient(circle at 25% 75%,#808F12 0%,rgba(128,143,18,0) 50%),
  radial-gradient(circle at 60% 30%,#2A5C0B 0%,rgba(42,92,11,0) 55%),
  radial-gradient(circle at 50% 50%,#042608 30%,#0A140B 75%);
 box-shadow:inset 0 0 40px rgba(195,209,74,.25),inset -10px -20px 60px rgba(4,38,8,.8);
 animation:morph var(--m,9s) ease-in-out infinite,spin var(--r,24s) linear infinite;transform:scale(var(--s,1));transition:transform .12s}
.orb::after{content:"";position:absolute;inset:0;border-radius:inherit;background:conic-gradient(from 0deg,transparent,rgba(195,209,74,.18),transparent 30%,rgba(128,143,18,.2),transparent 60%);mix-blend-mode:screen;animation:spin calc(var(--r,24s)/2) linear infinite reverse}
@keyframes morph{0%,100%{border-radius:46% 54% 52% 48%/50% 44% 56% 50%}25%{border-radius:56% 44% 42% 58%/46% 58% 42% 54%}50%{border-radius:42% 58% 56% 44%/58% 46% 54% 42%}75%{border-radius:52% 48% 46% 54%/42% 54% 46% 58%}}
@keyframes spin{to{rotate:360deg}}
.txt{font:300 22px/1.35 Outfit,system-ui,sans-serif;text-align:center;max-width:22ch;min-height:3em;padding:0 16px}.txt span{color:#6B6B6B}
.seg{display:inline-flex;background:var(--s2);border-radius:999px;padding:4px;gap:2px;margin:24px 16px 40px;flex-wrap:wrap;justify-content:center}
.seg button{border:0;background:transparent;color:var(--t2);font:500 14px "Google Sans",system-ui,sans-serif;padding:10px 16px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--s3);color:var(--t1)}
@media (prefers-reduced-motion:reduce){.orb,.orb::after{animation:none}}
</style></head><body>
<div class="top"><span class="badge">Pinu</span><span class="on"><i></i><b id="lbl" style="font-weight:400">Em repouso</b></span></div>
<div class="stage"><div class="glow" id="g"></div><div class="orb" id="o"></div></div>
<p class="txt" id="t">Oi! Sou o Pinu. <span>Como posso ajudar hoje?</span></p>
<div class="seg" id="seg">
<button data-s="repouso" aria-pressed="true">Repouso</button><button data-s="ouvindo">Ouvindo</button><button data-s="pensando">Pensando</button><button data-s="falando">Falando</button></div>
<script>
const o=document.getElementById('o'),t=document.getElementById('t'),lbl=document.getElementById('lbl');let st='repouso',ph=0;
const S={repouso:{m:'9s',r:'24s',l:'Em repouso',x:'Oi! Sou o Pinu. <span>Como posso ajudar hoje?</span>'},
ouvindo:{m:'4s',r:'18s',l:'Ouvindo…',x:'Quais tarefas da equipe <span>vencem esta semana</span>'},
pensando:{m:'2.4s',r:'5s',l:'Pensando…',x:'<span>Buscando nas tarefas…</span>'},
falando:{m:'5s',r:'16s',l:'Falando',x:'São 4 tarefas. A mais urgente <span>é a reunião dos Guardiões.</span>'}};
document.getElementById('seg').onclick=e=>{const b=e.target.closest('button');if(!b)return;st=b.dataset.s;document.querySelectorAll('#seg button').forEach(x=>x.setAttribute('aria-pressed',x===b));const c=S[st];o.style.setProperty('--m',c.m);o.style.setProperty('--r',c.r);lbl.textContent=c.l;t.innerHTML=c.x};
function tick(){ph+=.06;let s=1;
 if(st==='repouso')s=1+Math.sin(ph*.5)*.02;
 if(st==='ouvindo')s=1+Math.abs(Math.sin(ph*2.3)*Math.sin(ph*.9))*.09+Math.random()*.015;
 if(st==='pensando')s=.96+Math.sin(ph*1.2)*.02;
 if(st==='falando')s=1+Math.max(0,Math.sin(ph*3.1))*.06*(.6+.4*Math.sin(ph*.7));
 o.style.setProperty('--s',s.toFixed(3));requestAnimationFrame(tick)}
if(!matchMedia('(prefers-reduced-motion: reduce)').matches)tick();
</script></body></html>
