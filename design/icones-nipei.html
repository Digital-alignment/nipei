<title>Ícones Nipëi OS</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans:opsz,wght@17..18,400..700&family=Outfit:wght@200..700&display=swap">
<style>
/* Layout: biblioteca em grade de blocos, agrupada por conjunto; barra de filtros fixa; painel de detalhe lateral (gaveta no celular). Tema escuro primeiro. */
:root{
  --bg:#0A0A0A; --s1:#141414; --s2:#1A1A1A; --s3:#303030; --line:#424242;
  --t1:#FFFFFF; --t2:#B3B3B3; --t3:#858585;
  --ac:#C3D14A; --ac-ink:#0A0A0A; --ac-soft:#1B2410; --ac-text:#C3D14A;
  --warn:#FF6B5E; --warn-soft:#2C1514;
  --display:"Outfit",system-ui,sans-serif; --body:"Google Sans",system-ui,sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#FFFFFF; --s1:#F5F5F5; --s2:#EDEDED; --s3:#DEDEDE; --line:#B3B3B3;
  --t1:#1A1A1A; --t2:#424242; --t3:#6B6B6B;
  --ac:#2A5C0B; --ac-ink:#FFFFFF; --ac-soft:#EEF3E8; --ac-text:#2A5C0B;
  --warn:#B3261E; --warn-soft:#FBEAE9; color-scheme:light}}
:root[data-theme="light"]{
  --bg:#FFFFFF; --s1:#F5F5F5; --s2:#EDEDED; --s3:#DEDEDE; --line:#B3B3B3;
  --t1:#1A1A1A; --t2:#424242; --t3:#6B6B6B;
  --ac:#2A5C0B; --ac-ink:#FFFFFF; --ac-soft:#EEF3E8; --ac-text:#2A5C0B;
  --warn:#B3261E; --warn-soft:#FBEAE9; color-scheme:light}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--t1);font-family:var(--body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{padding-block:32px 20px;display:flex;flex-wrap:wrap;gap:16px 40px;align-items:flex-end;justify-content:space-between}
h1{font:200 clamp(36px,6vw,56px)/1.02 var(--display);margin:0;letter-spacing:-.01em;text-wrap:balance}
h1 span{color:var(--t3)}
.lede{color:var(--t2);max-width:60ch;margin:10px 0 0}
.stats{display:flex;gap:28px;flex-wrap:wrap}
.stat b{display:block;font:200 36px/1 var(--display);font-variant-numeric:tabular-nums}
.stat span{font:500 11px var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--t3)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;border-bottom:1px solid var(--s3)}
.seg{display:inline-flex;background:var(--s2);border-radius:999px;padding:4px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;color:var(--t2);font:500 14px var(--body);padding:9px 14px;border-radius:999px;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--s3);color:var(--t1);box-shadow:inset 0 0 0 1px var(--line)}
.seg button em{font-style:normal;color:var(--t3);margin-left:4px;font-variant-numeric:tabular-nums}
.search{flex:1 1 220px;display:flex;align-items:center;gap:8px;background:var(--s2);border-radius:999px;padding:0 16px;min-width:0}
.search svg{width:18px;height:18px;color:var(--t3);flex:none}
.search input{flex:1;min-width:0;border:0;background:transparent;color:var(--t1);font:400 15px var(--body);padding:11px 0;outline:none}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:0;background:var(--s2);color:var(--t2);font:500 13px var(--body);padding:8px 12px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ac);color:var(--ac-ink)}
.chip.evit[aria-pressed="true"]{background:var(--warn);color:#0A0A0A}
button:focus-visible,input:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
main{padding-block:8px 64px}
section.set{padding-top:28px}
.sethead{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline;margin-bottom:14px}
.sethead h2{font:600 20px var(--display);margin:0}
.sethead p{margin:0;color:var(--t2);font-size:14px;max-width:70ch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--cell,112px),1fr));gap:8px}
.tile{position:relative;border:0;background:var(--s1);color:var(--t1);border-radius:16px;padding:14px 10px 10px;display:flex;flex-direction:column;align-items:center;gap:10px;cursor:pointer;font:inherit;transition:background .15s}
.tile:hover{background:var(--s2)}
.tile[aria-current="true"]{background:var(--s2);box-shadow:inset 0 0 0 1.5px var(--ac)}
.tile svg{width:var(--icon,40px);height:var(--icon,40px);display:block;margin-block:6px}
.tile .nm{text-transform:none;font-size:12px;color:var(--t2);line-height:1.2;text-align:center;min-height:2.4em;display:flex;align-items:center;overflow-wrap:anywhere}
.tile .id{font:300 11px var(--display);color:var(--t3);font-variant-numeric:tabular-nums}
.tile .uso{position:absolute;top:8px;left:8px;background:var(--ac-soft);color:var(--ac-text);font:600 10px var(--body);padding:3px 7px;border-radius:999px}
.tile.ev svg{opacity:.4}
.tile.ev::after{content:"";position:absolute;top:10px;right:10px;width:7px;height:7px;border-radius:50%;background:var(--warn)}
.empty{color:var(--t2);padding:40px 0}
/* painel */
.panel{position:fixed;right:0;top:0;bottom:0;width:min(380px,100%);background:var(--s1);border-left:1px solid var(--s3);z-index:20;display:flex;flex-direction:column;padding:calc(20px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) 20px;gap:16px;overflow-y:auto;transform:translateX(100%);transition:transform .22s ease}
.panel.open{transform:none}
.ph{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.ph h3{font:300 30px/1.05 var(--display);margin:0;text-wrap:balance}
.ph small{display:block;color:var(--t3);font:400 13px var(--body);margin-top:6px}
.x{border:0;background:var(--s3);color:var(--t1);width:44px;height:44px;border-radius:50%;display:grid;place-items:center;cursor:pointer;flex:none}
.x svg{width:20px;height:20px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.duo div{border-radius:16px;aspect-ratio:1;display:grid;place-items:center}
.duo svg{width:62%;height:62%}
.duo .d{background:#0A0A0A;color:#FFFFFF}.duo .l{background:#FFFFFF;color:#1A1A1A;box-shadow:inset 0 0 0 1px var(--s3)}
.sizes{display:flex;gap:18px;align-items:flex-end;background:var(--s2);border-radius:16px;padding:16px;color:var(--ac-text)}
.sizes figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:6px}
.sizes figcaption{font:300 11px var(--display);color:var(--t3)}
.inbtn{display:flex;gap:8px;flex-wrap:wrap}
.b{border:0;border-radius:999px;display:inline-flex;align-items:center;gap:8px;font:600 15px var(--body);padding:12px 18px;cursor:pointer}
.b svg{width:18px;height:18px}
.b.pri{background:var(--ac);color:var(--ac-ink)}.b.ton{background:var(--s3);color:var(--t1)}
.meta{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px;margin:0}
.meta dt{color:var(--t3)}.meta dd{margin:0;overflow-wrap:anywhere}
.tag{display:inline-block;padding:2px 9px;border-radius:999px;background:var(--s3);font-size:12px}
.tag.evitar{background:var(--warn-soft);color:var(--warn)}
.note{font-size:13px;color:var(--t2);background:var(--warn-soft);border-radius:12px;padding:10px 12px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
.status{font-size:13px;color:var(--ac-text);min-height:1.2em}
textarea.code{width:100%;height:90px;background:var(--s2);color:var(--t2);border:0;border-radius:12px;padding:10px;font:400 11px/1.4 var(--body);resize:vertical}
@media (min-width:900px){body.has-panel .wrap{padding-right:calc(380px + 16px)}}
@media (max-width:640px){
  .bar{position:static}
  #sets{flex-wrap:nowrap;overflow-x:auto;max-width:100%}
  .panel{top:auto;width:100%;height:82%;border-left:0;border-top:1px solid var(--s3);border-radius:24px 24px 0 0;transform:translateY(100%);padding-left:max(20px,env(safe-area-inset-left,0px))}
  .panel.open{transform:none}
}
@media (prefers-reduced-motion:reduce){.panel,.tile{transition:none}}
</style>

<div class="wrap">
  <header class="top">
    <div>
      <h1>Ícones<br><span>Nipëi OS</span></h1>
      <p class="lede">Todos os ícones e símbolos criados até agora, num só lugar. Cada um é um SVG de uma cor que segue o tema. Toque num ícone para ver tamanhos, uso e copiar o código.</p>
    </div>
    <div class="stats" id="stats"></div>
  </header>

  <div class="bar" role="toolbar" aria-label="Filtros">
    <div class="seg" id="sets"></div>
    <label class="search" for="q"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" id="qicon"></svg><input id="q" type="search" placeholder="Buscar por nome ou número" autocomplete="off"></label>
    <div class="chips" id="tags"></div>
    <div class="seg" id="size" aria-label="Tamanho"></div>
  </div>

  <main id="main"></main>
</div>

<aside class="panel" id="panel" aria-hidden="true" aria-label="Detalhe do ícone">
  <div class="ph"><div><h3 id="pn"></h3><small id="pf"></small></div><button class="x" id="close" aria-label="Fechar"></button></div>
  <div class="duo"><div class="d" id="pd"></div><div class="l" id="pl"></div></div>
  <div class="sizes" id="ps"></div>
  <div class="inbtn" id="pb"></div>
  <dl class="meta" id="pm"></dl>
  <div class="note" id="pnote" hidden>Símbolo sagrado ou religioso de outro povo. Não usar como ícone do Nipëi OS.</div>
  <textarea class="code" id="pcode" readonly aria-label="Código SVG"></textarea>
  <div class="actions"><button class="b pri" id="copy"></button></div>
  <div class="status" id="st" role="status"></div>
</aside>

const SETS=[
  {k:'all',t:'Todos'},
  {k:'f',t:'Funcionais',h:'Funcionais · lote 1',p:'34 ícones de ação no traço dos símbolos: traço grosso, pontas redondas, pontos como assinatura e triângulos cheios para direção. Editar é a pena do lote 3.'},

];
const TAGS=['natureza','geométrico','glifo','objeto','funcional','evitar'];
const SIZES=[['P',28,96],['M',40,112],['G',64,150]];
const byId=Object.fromEntries(DATA.map(d=>[d.id,d]));
const svg=(d,extra='')=>`<svg viewBox="${d.vb}" fill="currentColor"${d.fr?' fill-rule="evenodd"':''} aria-hidden="true" ${extra}><path d="${d.d}"/></svg>`;
const icon=n=>byId[n]?svg(byId[n]):'';
const raw=d=>`<svg xmlns="http://www.w3.org/2000/svg" viewBox="${d.vb}" fill="currentColor"${d.fr?' fill-rule="evenodd"':''}><path d="${d.d}"/></svg>`;
let st={set:'all',tags:new Set(),q:'',size:1,cur:null};

const save=()=>{try{localStorage.setItem('nipei-icones',JSON.stringify({size:st.size,set:st.set}))}catch(e){}};
const $=id=>document.getElementById(id);
$('qicon').outerHTML=icon('buscar').replace('<svg','<svg style="width:18px;height:18px;color:var(--t3);flex:none"');
$('close').innerHTML=icon('fechar');
$('copy').innerHTML=icon('editar')+'Copiar SVG';
$('stats').innerHTML=[['Total',DATA.length],['Funcionais',DATA.filter(d=>d.set==='f').length],['Símbolos',DATA.filter(d=>d.set!=='f').length],['Com uso proposto',DATA.filter(d=>d.uso).length]].map(([t,n])=>`<div class="stat"><b>${n}</b><span>${t}</span></div>`).join('');
function renderBar(){
  $('sets').innerHTML=SETS.map(s=>{const n=s.k==='all'?DATA.length:DATA.filter(d=>d.set===s.k).length;return `<button aria-pressed="${st.set===s.k}" data-s="${s.k}">${s.t}<em>${n}</em></button>`}).join('');
  $('tags').innerHTML=TAGS.map(t=>`<button class="chip ${t==='evitar'?'evit':''}" aria-pressed="${st.tags.has(t)}" data-t="${t}">${t}</button>`).join('');
  $('size').innerHTML=SIZES.map((s,i)=>`<button aria-pressed="${st.size===i}" data-z="${i}" aria-label="Tamanho ${s[0]}">${s[0]}</button>`).join('');
  document.documentElement.style.setProperty('--icon',SIZES[st.size][1]+'px');
  document.documentElement.style.setProperty('--cell',SIZES[st.size][2]+'px');
}
function match(d){
  if(st.set!=='all'&&d.set!==st.set)return false;
  if(st.tags.size&&!st.tags.has(d.tag))return false;
  const q=st.q.trim().toLowerCase(); if(!q)return true;
  return (d.name+' '+d.id+' '+d.uso+' '+d.tag).toLowerCase().includes(q);
}
function render(){
  const out=SETS.filter(s=>s.k!=='all'&&(st.set==='all'||st.set===s.k)).map(s=>{
    const items=DATA.filter(d=>d.set===s.k&&match(d)); if(!items.length)return '';
    return `<section class="set"><div class="sethead"><h2>${s.h}</h2><p>${s.p}</p></div><div class="grid">${items.map(d=>`<button class="tile ${d.tag==='evitar'?'ev':''}" data-id="${d.id}" aria-current="${st.cur===d.id}" aria-label="${d.name} ${d.id}">${d.uso?`<span class="uso">${d.uso}</span>`:''}${svg(d)}<span class="nm">${d.name}</span>${d.id!==d.name?`<span class="id">${d.id}</span>`:''}</button>`).join('')}</div></section>`;
  }).join('');
  $('main').innerHTML=out||'<p class="empty">Nenhum ícone com esse filtro. Limpe a busca ou os filtros.</p>';
}
function open(id){
  const d=byId[id]; if(!d)return; st.cur=id;
  $('pn').textContent=d.name; $('pf').textContent=d.id+'.svg';
  $('pd').innerHTML=svg(d); $('pl').innerHTML=svg(d);
  $('ps').innerHTML=[48,32,24,20,16].map(s=>`<figure>${svg(d,`width="${s}" height="${s}"`)}<figcaption>${s}</figcaption></figure>`).join('');
  $('pb').innerHTML=`<span class="b pri">${svg(d)}Ação</span><span class="b ton">${svg(d)}Secundário</span>`;
  const setName=SETS.find(s=>s.k===d.set).h;
  $('pm').innerHTML=`<dt>Conjunto</dt><dd>${setName}</dd><dt>Tipo</dt><dd><span class="tag ${d.tag}">${d.tag}</span></dd><dt>Uso proposto</dt><dd>${d.uso||'—'}</dd><dt>Arquivo</dt><dd>design/icones/${d.set==='f'?'funcionais':d.set==='s1'?'simbolos':d.set==='s2'?'simbolos-2':'simbolos-3'}/${d.id}.svg</dd>`;
  $('pnote').hidden=d.tag!=='evitar';
  $('pcode').value=raw(d); $('st').textContent='';
  $('panel').classList.add('open');document.body.classList.add('has-panel'); $('panel').setAttribute('aria-hidden','false');
  document.querySelectorAll('.tile[aria-current="true"]').forEach(t=>t.setAttribute('aria-current','false'));
  const t=document.querySelector(`.tile[data-id="${id}"]`); if(t)t.setAttribute('aria-current','true');
}
function close(){ $('panel').classList.remove('open');document.body.classList.remove('has-panel'); $('panel').setAttribute('aria-hidden','true'); st.cur=null; document.querySelectorAll('.tile[aria-current="true"]').forEach(t=>t.setAttribute('aria-current','false'));}
document.addEventListener('click',e=>{
  const s=e.target.closest('[data-s]'); if(s){st.set=s.dataset.s;save();renderBar();render();return}
  const t=e.target.closest('[data-t]'); if(t){const k=t.dataset.t;st.tags.has(k)?st.tags.delete(k):st.tags.add(k);renderBar();render();return}
  const z=e.target.closest('[data-z]'); if(z){st.size=+z.dataset.z;save();renderBar();return}
  const tile=e.target.closest('.tile'); if(tile){open(tile.dataset.id);return}
});
$('close').onclick=close;
document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
$('q').addEventListener('input',e=>{st.q=e.target.value;render()});
$('copy').onclick=()=>{
  const txt=$('pcode').value;
  const fb=()=>{$('pcode').focus();$('pcode').select();$('st').textContent='Código selecionado. Use Ctrl+C para copiar.'};
  try{navigator.clipboard.writeText(txt).then(()=>{$('st').textContent='SVG copiado.'},fb)}catch(err){fb()}
};
